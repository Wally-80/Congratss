# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
# Added preferIPv4Stack to fix "Connection reset" on Windows
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true -Dsun.net.client.defaultConnectTimeout=60000 -Dsun.net.client.defaultReadTimeout=60000

# Re-enabling the daemon can sometimes help Windows handle file locks better 
# by maintaining a single persistent process.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.vfs.watch=true

# These settings help avoid corruption on Windows
org.gradle.caching=true
org.gradle.unsafe.configuration-cache=false

android.useAndroidX=true
